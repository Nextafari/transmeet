services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      # Persist HuggingFace model downloads (NLLB, Whisper) across rebuilds
      # so a fresh container does not re-download gigabytes on first use.
      - hf-hub-cache:/home/app/.cache/huggingface

volumes:
  hf-hub-cache:
